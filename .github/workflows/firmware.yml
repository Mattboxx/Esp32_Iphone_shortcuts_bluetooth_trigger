name: Firmware

# Builds every chip variant on each push / PR, runs the settings-contract
# tests, and on a "v*" tag publishes a GitHub Release with ready-to-flash files.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["docs/**", "marketing/**", "**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install tools
        run: pip install platformio "esptool>=4.7,<5"

      - name: Settings contract tests (web flasher <-> firmware)
        run: node test/host/run_tests.mjs

      - name: Build all variants + merged images
        run: python scripts/make_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            firmware/*.bin
            firmware/manifest.json
