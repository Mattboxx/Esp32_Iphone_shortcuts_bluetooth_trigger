name: Firmware

# Builds every chip variant on each push / PR and runs the settings-contract
# tests. When a GitHub Release is published (any tag name), the release job
# attaches the firmware files of that tag: the same binaries the web installer
# serves. To (re)attach files to an existing release: Actions -> Firmware ->
# Run workflow -> tag = the release tag.
# Security: read-only token by default; only the release job can write, and
# every third-party action is pinned to a full commit SHA (Dependabot bumps them).
on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "marketing/**", "**.md"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach files to (empty = just build)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: firmware-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Cache PlatformIO
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install tools (pinned versions)
        run: pip install "platformio==6.2.0" "esptool==4.12.0"

      - name: Settings contract tests (web flasher <-> firmware)
        run: |
          cc --version | head -1
          node test/host/run_tests.mjs

      - name: Build all variants + merged images
        run: python scripts/make_release.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware
          path: firmware/*
          if-no-files-found: error

  release:
    # Published release, or a manual run with a tag.
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: build              # only if the source builds and the tests pass
    runs-on: ubuntu-latest
    permissions:
      contents: write          # attach files to the Release, nothing else
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Verify committed firmware against manifest.json
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          m = json.loads(pathlib.Path("firmware/manifest.json").read_text())
          bad = 0
          for b in m["builds"]:
              data = pathlib.Path("firmware", b["file"]).read_bytes()
              ok = hashlib.sha256(data).hexdigest() == b["sha256"] and len(data) == b["size"]
              print(("OK  " if ok else "BAD ") + b["file"])
              bad += not ok
          sys.exit(1 if bad else 0)
          PY
          cd firmware && sha256sum *.bin > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attach files to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          files: |
            firmware/*.bin
            firmware/manifest.json
            firmware/SHA256SUMS.txt
