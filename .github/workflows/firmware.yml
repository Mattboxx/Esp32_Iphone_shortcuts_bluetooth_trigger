name: Firmware

# Builds every chip variant on each push / PR and runs the settings-contract
# tests. On a "v*" tag a separate job publishes a GitHub Release.
# Security: read-only token by default; only the release job can write, and
# every third-party action is pinned to a full commit SHA (Dependabot bumps them).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["docs/**", "marketing/**", "**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install tools (pinned versions)
        run: pip install "platformio==6.2.0" "esptool==4.12.0"

      - name: Settings contract tests (web flasher <-> firmware)
        run: |
          cc --version | head -1
          node test/host/run_tests.mjs

      - name: Build all variants + merged images
        run: python scripts/make_release.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: firmware/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the Release, nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware
          path: firmware

      - name: Checksums
        run: cd firmware && sha256sum *.bin > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            firmware/*.bin
            firmware/manifest.json
            firmware/SHA256SUMS.txt
