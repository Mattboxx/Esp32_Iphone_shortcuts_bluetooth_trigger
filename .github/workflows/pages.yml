name: Website

# Publishes docs/ (landing page + web flasher) and the firmware in firmware/
# to GitHub Pages. One-time setup: Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main, std-bluetooth-trigger-HID-ESP32]
    paths: ["docs/**", "firmware/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/firmware
          cp -r docs/. _site/
          cp firmware/*.bin firmware/manifest.json _site/firmware/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
