; PlatformIO - ESP32 BT Trigger
; Original ESP32 only (DevKit, WROOM, WROVER, PICO, D1 mini32, M5 Atom...):
; it needs Classic Bluetooth HID. iOS Shortcuts does not list Bluetooth LE
; (GATT) accessories as automation triggers, so BLE-only chips (ESP32-S3,
; C3, C6, H2...) cannot work.
; The firmware binary is the same for every ESP32 board: trigger mode, pins (LED,
; button, trigger input) are runtime settings written by the web flasher.
;
; Framework: ESP-IDF (NOT Arduino): the BT HID Device role is disabled in the
; precompiled Arduino libraries.

[platformio]
default_envs = esp32

[env]
; Platform 6.9.0: ESP-IDF 5.3.1 + GCC 13.2.0. CMake 3.30 is forced because the
; bundled 3.16 fails the compiler test on Windows.
platform = espressif32@6.9.0
framework = espidf
platform_packages =
    platformio/tool-cmake @ ~3.30.0
board_build.partitions = partitions.csv
board_upload.flash_size = 2MB
board_build.flash_mode = dio
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Serial port is auto-detected. If you have several devices, set yours:
; upload_port = COMx
; monitor_port = COMx

[env:esp32]
board = esp32dev
