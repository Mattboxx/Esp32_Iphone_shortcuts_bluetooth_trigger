; PlatformIO - ESP32 BT Trigger
; One source tree, one firmware per chip family:
;   esp32    -> Classic Bluetooth HID  (original ESP32: DevKit, WROOM, WROVER, PICO, D1 mini32, M5 Atom...)
;   esp32s3  -> Bluetooth LE HID       (ESP32-S3 DevKit, XIAO S3, AtomS3...)
;   esp32c3  -> Bluetooth LE HID       (ESP32-C3 SuperMini, XIAO C3, C3 DevKitM...)
;   esp32c6  -> Bluetooth LE HID       (ESP32-C6 DevKit, XIAO C6...)
; Every env also has a "-pin" edition (default trigger: GPIO4 to GND instead of
; power-on). The firmware binary is the same for every board of a family: pins (LED,
; button, trigger input) are runtime settings written by the web flasher.
;
; Framework: ESP-IDF (NOT Arduino): the BT HID Device role is disabled in the
; precompiled Arduino libraries.

[platformio]
default_envs = esp32

[env]
; Platform 6.9.0: ESP-IDF 5.3.1 + GCC 13.2.0. CMake 3.30 is forced because the
; bundled 3.16 fails the compiler test on Windows.
platform = espressif32@6.9.0
framework = espidf
platform_packages =
    platformio/tool-cmake @ ~3.30.0
board_build.partitions = partitions.csv
board_upload.flash_size = 2MB
board_build.flash_mode = dio
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Serial port is auto-detected. If you have several devices, set yours:
; upload_port = COMx
; monitor_port = COMx

[env:esp32]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32c3]
board = esp32-c3-devkitm-1

[env:esp32c6]
board = esp32-c6-devkitc-1

; ---- "Pin" edition: same firmware, default trigger = GPIO4 pulled to GND ----
[pin]
build_flags = -DBTT_EDITION_PIN=1

[env:esp32-pin]
extends = env:esp32
build_flags = ${pin.build_flags}

[env:esp32s3-pin]
extends = env:esp32s3
build_flags = ${pin.build_flags}

[env:esp32c3-pin]
extends = env:esp32c3
build_flags = ${pin.build_flags}

[env:esp32c6-pin]
extends = env:esp32c6
build_flags = ${pin.build_flags}
